<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINDOWKILL — Vệ tinh</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0618;
    font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none;cursor:crosshair}
  canvas{display:block;width:100%;height:100%}
  #hp{position:fixed;top:6px;left:8px;right:8px;height:6px;background:#ffffff18;border-radius:3px;overflow:hidden}
  #hpfill{height:100%;width:100%;background:#c084fc;border-radius:3px;transition:width .15s}
  #lbl{position:fixed;bottom:6px;left:0;right:0;text-align:center;color:#ffffffaa;font-size:11px;letter-spacing:2px}
  #dmg{position:fixed;pointer-events:none;color:#fff;font-weight:800;font-size:18px;text-shadow:0 0 6px #c084fc}

  /* boot overlay (cinematics polish): overlay tim #7c3aed alpha .25 fade-in 200ms + logo pulse */
  #boot{position:fixed;inset:0;background:rgba(124,58,237,.25);display:flex;flex-direction:column;
    gap:10px;align-items:center;justify-content:center;z-index:50;opacity:0;pointer-events:none;
    transition:opacity .2s ease-out}
  #boot.show{opacity:1}
  #boot-logo{font-size:46px;color:#c084fc;line-height:1;animation:bootPulse .6s ease-in-out 1}
  #boot-txt{color:#e9d5ff;font-size:12px;letter-spacing:4px;font-weight:700}
  @keyframes bootPulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){#boot-logo{animation:none}#boot{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hp"><div id="hpfill"></div></div>
<div id="lbl"></div>
<div id="boot" aria-hidden="true"><div id="boot-logo">◈</div><div id="boot-txt">VỆ TINH</div></div>
<script>
"use strict";
/* Vệ tinh WINDOWKILL — dumb renderer. Logic nằm ở cửa sổ chính.
 * Giao thức qua BroadcastChannel("windowkill_bus"):
 *   nhận: sat-init (đã có qua query), sat-dmg, sat-die, sat-steer, sat-warn
 *   gửi: sat-ready, sat-hit, sat-bye
 * Spec: studio/game-design/MULTIWINDOW-SPEC.md §2.1 */
const qp = new URLSearchParams(location.search);
const ID = qp.get("id") || ("sat" + Math.random().toString(36).slice(2));
const ROLE = qp.get("role") || "nest";
let HP = Math.max(1, parseInt(qp.get("hp") || "6", 10) || 6);
const MAXHP = HP;
const COLOR = /^#[0-9a-fA-F]{6}$/.test(qp.get("color") || "") ? qp.get("color") : "#8b2fc9";
const LABEL = (qp.get("label") || "VỆ TINH").slice(0, 24);
const ENR = qp.get("enr") === "1"; // M6: nhóc tinh nghịch nổi giận (vẽ mặt giận)
document.title = "WINDOWKILL — " + LABEL;
document.getElementById("lbl").textContent = LABEL;

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function fit() { canvas.width = innerWidth; canvas.height = innerHeight; }
fit(); addEventListener("resize", fit);

const bus = ("BroadcastChannel" in window) ? new BroadcastChannel("windowkill_bus") : null;
const post = (m) => { try { if (bus) bus.postMessage(Object.assign({ satId: ID }, m)); } catch (e) {} };

/* tự test khả năng di chuyển (R3) */
let canMove = false;
try {
  const x0 = window.screenX;
  window.moveBy(2, 0);
  canMove = window.screenX !== x0;
  window.moveBy(-2, 0);
} catch (e) { canMove = false; }

/* drift theo lệnh sat-steer */
let vx = 0, vy = 0, lastT = performance.now();
const bootT = performance.now(); // mốc mở cửa sổ (telegraph debris)
let warnT = 0; // telegraph tím M2
function drift(dt) {
  if (!canMove || (vx === 0 && vy === 0)) return;
  try {
    window.moveBy(vx * dt, vy * dt);
    // nảy ở biên desktop
    if (window.screenX <= 0 || window.screenX + outerWidth >= screen.availWidth) vx = -vx;
    if (window.screenY <= 0 || window.screenY + outerHeight >= screen.availHeight) vy = -vy;
  } catch (e) { canMove = false; }
}

let flash = 0, dieT = 0, dying = false, BOMB_T = null; // M8: giây còn lại của bom (từ sat-tick)
const eggs = [];
for (let i = 0; i < 7; i++) eggs.push({ a: Math.random() * Math.PI * 2, r: 18 + Math.random() * 46, s: 10 + Math.random() * 14, ph: Math.random() * 9 });

function drawNest(t) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.fillStyle = "#120a24"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (const e of eggs) {
    const pulse = 1 + 0.18 * Math.sin(t / 420 + e.ph);
    const x = cx + Math.cos(e.a) * e.r, y = cy + Math.sin(e.a) * e.r * 0.72;
    const g = ctx.createRadialGradient(x, y, 1, x, y, e.s * pulse);
    g.addColorStop(0, "#e9a8ff"); g.addColorStop(0.55, COLOR); g.addColorStop(1, "#3b0764");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(x, y, e.s * pulse, e.s * 0.8 * pulse, e.a, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,80,80,.9)"; // mắt trứng
    ctx.beginPath(); ctx.arc(x, y - e.s * 0.2, 2.4, 0, Math.PI * 2); ctx.fill();
  }
}
function drawFragment(t) {
  const cx = canvas.width / 2, cy = canvas.height / 2, r = 52 + 6 * Math.sin(t / 380);
  ctx.fillStyle = "#160a10"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = COLOR;
  ctx.beginPath();
  for (let i = 0; i < 9; i++) { // mảnh răng cưa
    const a = i / 9 * Math.PI * 2 + t / 2400, rr = r * (i % 2 ? 0.72 : 1);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#ff2020";
  ctx.beginPath(); ctx.arc(cx - 14, cy - 8, 7, 0, Math.PI * 2); ctx.arc(cx + 14, cy - 8, 7, 0, Math.PI * 2); ctx.fill();
}
function drawShield(t) {
  const cx = canvas.width / 2, cy = canvas.height / 2, r = 54;
  ctx.fillStyle = "#06121f"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = COLOR; ctx.lineWidth = 5; ctx.globalAlpha = 0.9 + 0.1 * Math.sin(t / 300);
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.fillStyle = "#bfe9ff"; ctx.font = "700 26px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("◈", cx, cy + 1);
}
function drawDebris(t) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  ctx.fillStyle = "#101018"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  // telegraph đỏ 0.7s đầu: cảnh báo trước khi bay (M4)
  const age = performance.now() - bootT;
  if (age < 700) {
    const p = (Math.sin(age / 90) + 1) / 2;
    ctx.strokeStyle = `rgba(255,60,60,${0.5 + 0.5 * p})`;
    ctx.lineWidth = 4 + 3 * p;
    ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
  }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-0.35 + 0.06 * Math.sin(t / 500));
  ctx.fillStyle = "#2a2a3a";
  ctx.beginPath(); ctx.moveTo(-70, -40); ctx.lineTo(10, -52); ctx.lineTo(72, -10); ctx.lineTo(40, 44); ctx.lineTo(-52, 38); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#ff5a5a"; ctx.lineWidth = 2; // vết nứt
  ctx.beginPath(); ctx.moveTo(-60, -30); ctx.lineTo(-10, 0); ctx.lineTo(-40, 30);
  ctx.moveTo(0, -45); ctx.lineTo(-10, 0); ctx.lineTo(50, 10); ctx.stroke();
  ctx.restore();
}

/* M8: bom cười — số đếm ngược to, nhấp nháy đỏ-cam, gấp gáp 3s cuối */
function drawBomb(t) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const urgent = BOMB_T !== null && BOMB_T <= 3;
  const blink = Math.floor(t / (urgent ? 120 : 300)) % 2 === 0;
  ctx.fillStyle = blink ? "#3a0d02" : "#1c0701"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const r = Math.min(canvas.width, canvas.height) * 0.2;
  ctx.fillStyle = "#2b2f36"; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#4a5058"; ctx.beginPath(); ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#c98a3a"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx + r * 0.6, cy - r * 0.7);
  ctx.quadraticCurveTo(cx + r * 1.2, cy - r * 1.5, cx + r * 0.9, cy - r * 1.9); ctx.stroke();
  const sp = (Math.sin(t / 70) + 1) / 2;
  ctx.fillStyle = `rgba(255,${140 + Math.floor(80 * sp)},40,.95)`;
  ctx.beginPath(); ctx.arc(cx + r * 0.9, cy - r * 1.9, 4 + 3 * sp, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = urgent ? "#ff3b30" : "#ffd166"; ctx.font = "700 64px system-ui";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(BOMB_T === null ? "?" : String(BOMB_T), cx, cy + r * 1.4);
  ctx.fillStyle = "#ff8f8f"; ctx.font = "700 15px system-ui";
  ctx.fillText("BẤM ĐỂ PHÁ!", cx, canvas.height - 26);
}
/* M5/M6: blob cartoon mắt to cho giant/minion/mother/chick (vui nhộn) */
function drawBlob(t) {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  const r = Math.min(canvas.width, canvas.height) * 0.26;
  ctx.fillStyle = "#0a0a14"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  const wob = Math.sin(t / 500) * 0.06;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(wob);
  ctx.fillStyle = COLOR;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  const ey = -r * 0.25, ex = r * 0.34;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-ex, ey, r * 0.22, 0, Math.PI * 2); ctx.arc(ex, ey, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = ENR ? "#ff2020" : "#1a1a2e";
  ctx.beginPath(); ctx.arc(-ex, ey, r * 0.1, 0, Math.PI * 2); ctx.arc(ex, ey, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#1a1a2e"; ctx.lineWidth = Math.max(3, r * 0.08); ctx.lineCap = "round";
  ctx.beginPath();
  if (ENR) ctx.arc(0, r * 0.75, r * 0.4, Math.PI * 1.15, Math.PI * 1.85);
  else ctx.arc(0, r * 0.1, r * 0.5, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
  ctx.restore();
  if (ENR) {
    ctx.fillStyle = "#ff8f8f"; ctx.font = "700 15px system-ui"; ctx.textAlign = "center";
    ctx.fillText("NỔI GIẬN!", cx, canvas.height - 26);
  }
}

function paint(t) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (ROLE === "nest") drawNest(t);
  else if (ROLE === "fragment") drawFragment(t);
  else if (ROLE === "shield") drawShield(t);
  else if (ROLE === "bomb") drawBomb(t);
  else if (ROLE === "debris") drawDebris(t);
  else drawBlob(t); // giant / minion / mother / chick
  if (flash > 0) { // flash trắng khi trúng đòn
    ctx.fillStyle = `rgba(255,255,255,${flash * 0.55})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    flash -= 0.06;
  }
  if (warnT > 0) { // telegraph tím: sắp chạm cửa sổ chính
    const p = (Math.sin(performance.now() / 70) + 1) / 2;
    ctx.strokeStyle = `rgba(192,132,252,${0.55 + 0.45 * p})`;
    ctx.lineWidth = 3 + 3 * p;
    ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
    warnT -= 0.016;
  }
  if (dying) { // hiệu ứng vỡ 300ms
    dieT += 16;
    ctx.fillStyle = `rgba(10,4,20,${Math.min(1, dieT / 300)})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2, r0 = dieT * 0.4, r1 = r0 + 26;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2 + Math.cos(a) * r0, canvas.height / 2 + Math.sin(a) * r0);
      ctx.lineTo(canvas.width / 2 + Math.cos(a) * r1, canvas.height / 2 + Math.sin(a) * r1);
      ctx.stroke();
    }
    if (dieT >= 300) { post({ type: "sat-bye", id: ID }); window.close(); }
  }
}

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
  drift(dt);
  paint(t);
  requestAnimationFrame(loop);
}

function paintHp() {
  document.getElementById("hpfill").style.width = (100 * HP / MAXHP) + "%";
}
function floatDmg(x, y) {
  const d = document.createElement("div"); d.id = "dmg"; d.textContent = "-1";
  d.style.left = x + "px"; d.style.top = y + "px";
  document.body.appendChild(d);
  let o = 1, yy = y;
  const iv = setInterval(() => { o -= 0.06; yy -= 2; d.style.opacity = o; d.style.top = yy + "px"; if (o <= 0) { clearInterval(iv); d.remove(); } }, 30);
}

canvas.addEventListener("mousedown", (e) => {
  if (dying) return;
  post({ type: "sat-hit", id: ID, x: Math.round(e.clientX), y: Math.round(e.clientY) });
});

if (bus) bus.onmessage = (ev) => {
  const m = ev.data || {};
  if (m.satId !== ID && m.id !== ID) return;
  if (m.type === "sat-dmg") {
    HP = Math.max(0, parseInt(m.hp, 10) || 0);
    paintHp(); flash = 1;
    if (m.x !== undefined) floatDmg(+m.x || 0, +m.y || 0);
  } else if (m.type === "sat-die") {
    if (!dying) { dying = true; dieT = 0; }
  } else if (m.type === "sat-steer") {
    const nvx = parseFloat(m.vx), nvy = parseFloat(m.vy);
    if (Number.isFinite(nvx) && Number.isFinite(nvy)) { vx = Math.max(-400, Math.min(400, nvx)); vy = Math.max(-400, Math.min(400, nvy)); }
  } else if (m.type === "sat-warn") {
    warnT = 0.5; // telegraph tím 0.5s (M2: mảnh sắp chạm cửa sổ chính)
  } else if (m.type === "sat-tick") {
    if (ROLE === "bomb") BOMB_T = Math.max(0, parseInt(m.t, 10) || 0); // M8: đếm ngược
  }
};

addEventListener("beforeunload", () => post({ type: "sat-bye", id: ID }));


/* boot overlay: fade-in 200ms + logo pulse 1 nhip khi mo popup */
(function () {
  var bootEl = document.getElementById("boot");
  if (!bootEl) return;
  var rm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (rm) { bootEl.remove(); return; }
  requestAnimationFrame(function () { bootEl.classList.add("show"); });
  setTimeout(function () {
    bootEl.style.transition = "opacity .4s ease-out";
    bootEl.classList.remove("show");
    setTimeout(function () { bootEl.remove(); }, 450);
  }, 500);
})();

/* khởi động */
paintHp();
post({ type: "sat-ready", id: ID, canMove: canMove });
requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(loop); });
</script>
</body>
</html>
