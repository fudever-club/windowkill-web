<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8" /><title>01-f1 · boot + kinetic cascade</title></head>
<body>
<template>
<style>
@font-face { font-family: 'Segoe UI Black'; src: local('Segoe UI Black'), local('Segoe UI'); font-weight: 900; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: #0A0A0F; color: #FFFDF5;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  }
  #g1, #g2 { position: absolute; inset: 0; }

  /* ---------- g1: arcade cabinet boot ---------- */
  .g1_center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #g1_ledrow { display: flex; align-items: center; gap: 18px; opacity: 0; }
  #g1_led { width: 18px; height: 18px; border-radius: 50%; background: #99E885;
    box-shadow: 0 0 14px #99E88588; }
  #g1_pw { font-family: "Courier New", Courier, monospace; font-size: 26px; color: #99E885; }
  #g1_sys { margin-top: 34px; font-family: "Courier New", Courier, monospace;
    font-size: 34px; letter-spacing: 0.28em; color: #C0F7FE; opacity: 0; white-space: pre; }
  #g1_card {
    margin-top: 64px; background: #0A0A0F; border: 4px solid #FFFDF5;
    box-shadow: 8px 8px 0 #FE90E8; padding: 40px 64px; transform: rotate(-2deg);
    opacity: 0; text-align: center;
  }
  #g1_mark { font-family: "Segoe UI Black", "Segoe UI", Arial, sans-serif; font-weight: 900;
    font-size: 130px; letter-spacing: -0.03em; line-height: 1; color: #FFDC8B; }
  #g1_est { margin-top: 16px; font-size: 24px; font-weight: 700; letter-spacing: 0.3em;
    text-transform: uppercase; color: #FFFDF5; }
  #g1_flash { position: absolute; inset: 0; background: #F7CB46; opacity: 0; }

  /* ---------- g2: kinetic cascade ---------- */
  .phrase {
    position: absolute; left: 0; right: 0; top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center;
    opacity: 0;
  }
  .pline { font-weight: 900; text-transform: uppercase; line-height: 0.92;
    letter-spacing: -0.035em; white-space: nowrap; }
  .pw { display: inline-block; opacity: 0; }
  .climaxrow {
    position: absolute; left: 50%; top: 50%;
    display: flex; align-items: center; gap: 0.32em; white-space: nowrap;
    font-weight: 900; font-size: 120px; text-transform: uppercase; letter-spacing: -0.02em;
    color: #FFFDF5; opacity: 0;
  }
  #g2_icon { position: relative; display: inline-flex; align-items: center; justify-content: center;
    width: 204px; height: 204px; color: #F7CB46; opacity: 0; }
  #g2_icon svg { width: 100%; height: 100%; display: block; }
  .ring { position: absolute; left: 50%; top: 50%; border-radius: 50%;
    border: 3px solid rgba(255, 253, 245, 0.25); opacity: 0;
    transform: translate(-50%, -50%) scale(0.4); }
  #g2_ring2 { border-color: rgba(254, 144, 232, 0.35); }
</style>

<div id="root" data-composition-id="01-f1" data-width="1920" data-height="1080" data-duration="19" data-root="true">
  <div id="g1">
    <div class="g1_center">
      <div id="g1_ledrow"><span id="g1_led"></span><span id="g1_pw">▮</span></div>
      <div id="g1_sys"></div>
      <div id="g1_card">
        <div id="g1_mark">FU-DEVER</div>
        <div id="g1_est">CLB LẬP TRÌNH · EST. 2018</div>
      </div>
    </div>
    <div id="g1_flash"></div>
  </div>
  <div id="g2">
    <div id="g2_stage"></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var T0 = 0.0;         // frame start (track seconds)
  var SPAN = 19.0;
  var tx = function (t) { return Math.round((t - T0) * 1000) / 1000; };
  var tl = gsap.timeline({ paused: true });

  /* ---------- g1: boot (track 0–8) ---------- */
  var ledrow = document.getElementById("g1_ledrow");
  var sysline = document.getElementById("g1_sys");
  var card = document.getElementById("g1_card");
  var pw = document.getElementById("g1_pw");
  var flash = document.getElementById("g1_flash");

  // typewriter "FU-DEVER SYSTEM — READY" starts at track 4.7, 0.09s/char
  var SYS_TEXT = "FU-DEVER SYSTEM — READY";
  var charSpans = [];
  for (var i = 0; i < SYS_TEXT.length; i++) {
    var s = document.createElement("span");
    s.textContent = SYS_TEXT[i] === " " ? "\u00A0" : SYS_TEXT[i];
    s.style.opacity = "0";
    sysline.appendChild(s);
    charSpans.push(s);
  }

  gsap.set(sysline, { opacity: 0 });
  gsap.set(ledrow, { opacity: 0 });
  gsap.set(card, { opacity: 0, scale: 0.8, y: 24 });
  gsap.set(flash, { opacity: 0 });

  tl.to(ledrow, { opacity: 1, duration: 0.01 }, tx(2.0));
  for (var b = 0; b < 6; b++) {              // caret blink 2.2 → 4.6
    tl.set(pw, { opacity: b % 2 }, tx(2.2 + b * 0.4));
  }
  tl.set(sysline, { opacity: 1 }, tx(4.6));
  charSpans.forEach(function (sp, k) {
    tl.set(sp, { opacity: 1 }, tx(4.7 + k * 0.09));
  });
  tl.fromTo(card, { opacity: 0, scale: 0.8, y: 24 },
    { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.2)", immediateRender: false },
    tx(6.1));
  tl.to(flash, { opacity: 1, duration: 0.05, ease: "power3.in" }, tx(7.78));
  tl.to(flash, { opacity: 0, duration: 0.16, ease: "power2.out" }, tx(7.85));

  // group windows
  tl.set("#g1", { autoAlpha: 1 }, 0);
  tl.set("#g1", { autoAlpha: 0 }, tx(8.0));

  /* ---------- g2: kinetic cascade (track 8–19) ---------- */
  var stage = document.getElementById("g2_stage");
  var root = document.getElementById("root");
  var TAU = Math.PI * 2;

  function hexRgba(hex, a) {
    var h = String(hex).replace(/^#/, "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  var words = function (s) { return String(s).trim().split(/\s+/).filter(Boolean); };

  var PHRASES = [
    { in: 11.5, out: 13.5, lines: [
      { text: "CỬA SỔ", size: 190, x: 0 },
      { text: "CHÍNH LÀ", size: 150, x: 90, accent: "#FE90E8" },
      { text: "MÁU", size: 280, x: 90 },
    ]},
    { in: 13.5, out: 15.0, lines: [
      { text: "QUÁI GẶM VIỀN", size: 130, x: 0 },
      { text: "ĐẠN ĐÁ", size: 190, x: 90, accent: "#C0F7FE" },
      { text: "CỬA SỔ BAY", size: 150, x: 420 },
    ]},
    { in: 15.0, out: 17.0, lines: [
      { text: "SỐNG SÓT", size: 130, x: 0 },
      { text: "LÂU HƠN", size: 290, x: 60, accent: "#99E885" },
      { text: "ĐIỂM CAO HƠN", size: 130, x: 460 },
    ]},
  ];
  var CLIMAX = { text: "HIGH SCORE PARADE", in: 17.9, iconAt: 18.55, size: 92 };

  var PH = document.createElement("div");
  PH.innerHTML = "";
  function mkIconSVG(name) {
    var LIB = {
      star: '<path d="M12 2.2l2.9 6.4 7 .6-5.3 4.6 1.6 6.8L12 17.4 5.8 20.6l1.6-6.8L2.1 9.2l7-.6z"/>',
    };
    return '<svg viewBox="0 0 24 24" fill="currentColor" width="100%" height="100%">' + LIB[name] + "</svg>";
  }

  var phraseEls = [];
  PHRASES.forEach(function (p, pi) {
    var el = document.createElement("div");
    el.className = "phrase";
    p._spans = [];
    p.lines.forEach(function (ln) {
      var lEl = document.createElement("div");
      lEl.className = "pline";
      lEl.style.fontSize = ln.size + "px";
      lEl.style.marginLeft = (ln.x || 0) + "px";
      words(ln.text).forEach(function (wtext) {
        var w = document.createElement("span");
        w.className = "pw";
        w.textContent = wtext;
        if (ln.accent) w.style.color = ln.accent;
        lEl.appendChild(w);
        lEl.appendChild(document.createTextNode(" "));
        p._spans.push(w);
      });
      el.appendChild(lEl);
    });
    stage.appendChild(el);
    phraseEls.push(el);
  });

  // climax (slide-in + ringing star)
  var cEl = document.createElement("div");
  cEl.className = "climaxrow";
  cEl.style.fontSize = CLIMAX.size + "px";
  var iconEl = document.createElement("span");
  iconEl.id = "g2_icon";
  iconEl.innerHTML = '<span style="position:absolute;display:flex;align-items:center;justify-content:center;width:100%;height:100%" id="g2_glyph">' + mkIconSVG("star") + "</span>" +
    '<span class="ring" style="width:265px;height:265px"></span>' +
    '<span class="ring" id="g2_ring2" style="width:265px;height:265px"></span>';
  // words before and after the icon slot
  var cparts = CLIMAX.text.split(" ");
  var pre = document.createElement("span"); pre.textContent = cparts[0] + " " + cparts[1];
  var post = document.createElement("span"); post.textContent = cparts[2];
  cEl.appendChild(pre); cEl.appendChild(iconEl); cEl.appendChild(post);
  stage.appendChild(cEl);
  var glyph = document.getElementById("g2_glyph");
  var rings = root.querySelectorAll(".ring");

  phraseEls.forEach(function (el) { gsap.set(el, { opacity: 0 }); });
  gsap.set(cEl, { xPercent: -50, yPercent: -50, x: 1400, opacity: 0 });
  gsap.set(iconEl, { opacity: 0 });
  gsap.set(glyph, { scale: 0.4, rotation: -8, opacity: 0 });
  gsap.set(rings, { opacity: 0, scale: 0.4 });

  var WORD_FADE = 0.18, CUT = 0.1, SLIDE = 0.42;
  PHRASES.forEach(function (p) {
    var n = p._spans.length;
    var start = p.in, end = p.out - Math.max(0.25, (p.out - p.in) * 0.2);
    tl.set(phraseEls[PHRASES.indexOf(p)], { opacity: 1 }, tx(start));
    p._spans.forEach(function (w, i) {
      var t = n <= 1 ? start : start + ((end - start) * i) / (n - 1);
      tl.to(w, { opacity: 1, duration: WORD_FADE, ease: "power2.out", overwrite: "auto", immediateRender: false }, tx(t));
    });
    tl.to(phraseEls[PHRASES.indexOf(p)], { opacity: 0, duration: CUT, ease: "power2.in", overwrite: "auto" }, tx(p.out - CUT));
  });

  tl.to(cEl, { x: 0, opacity: 1, duration: SLIDE, ease: "power3.out", overwrite: "auto", immediateRender: false }, tx(CLIMAX.in));
  tl.to(iconEl, { opacity: 1, duration: 0.2, ease: "power3.out", overwrite: "auto", immediateRender: false }, tx(CLIMAX.iconAt));
  tl.fromTo(glyph, { scale: 0.4, rotation: -8, opacity: 0 },
    { scale: 1, rotation: 0, opacity: 1, duration: 0.35, ease: "back.out(2.4)", immediateRender: false },
    tx(CLIMAX.iconAt + 0.05));
  tl.to(glyph, { rotation: 13, duration: 0.1, ease: "power2.out", overwrite: "auto", immediateRender: false }, tx(CLIMAX.iconAt + 0.4));
  tl.to(glyph, { rotation: 0, duration: 0.8, ease: "elastic.out(1, 0.25)", overwrite: "auto", immediateRender: false }, tx(CLIMAX.iconAt + 0.5));
  [0, 0.28].forEach(function (off) {
    tl.fromTo(rings, { scale: 0.4, opacity: 0.55 },
      { scale: 1.5, opacity: 0, duration: 0.8, ease: "power2.out", stagger: 0.08, immediateRender: false },
      tx(CLIMAX.iconAt + 0.42 + off));
  });

  tl.set("#g2", { autoAlpha: 1 }, tx(8.0));
  // g2 holds to frame end (19) — no hide (assembler hard-cuts to next frame)

  tl.to({}, { duration: 0.001 }, SPAN - 0.001);
  tl.seek(0);
  window.__timelines["01-f1"] = tl;
})();
</script>
</template>
</body>
</html>
