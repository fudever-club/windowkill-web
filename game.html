  <div class="overlay" id="ov-draft">
    <h2><svg class="ic" aria-hidden="true"><use href="#i-levelup"/></svg> <span data-i18n="draft.title">LÊN CẤP! Chọn 1 nâng cấp</span></h2>
    <div class="cards" id="draft-cards"></div>
  </div>

  <div class="overlay" id="ov-pause">
    <div class="ov-brand"><img src="assets/brand/dever-logo.png" alt="FU-DEVER" data-hide-onerror> FU-DEVER</div>
    <h2><svg class="ic" aria-hidden="true"><use href="#i-pause"/></svg> <span data-i18n="pause.title">Tạm dừng</span></h2>
    <div class="menu-btns">
      <button class="btn-big" id="btn-resume" style="font-size:16px;padding:12px 28px"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg> <span data-i18n="pause.resume">Tiếp tục</span></button>
      <button class="btn-ghost" id="btn-restart"><svg class="ic" aria-hidden="true"><use href="#i-restart"/></svg> <span data-i18n="pause.retry">Chơi lại</span></button>
      <button class="btn-ghost" id="btn-quit"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg> <span data-i18n="pause.quit">Về menu</span></button>
    </div>
    <!-- Item 4 — Sprint Round 2: đổi Độ Nhảy Cửa Sổ giữa run -->
    <div class="menu-btns" style="margin-top:12px;align-items:center">
      <span style="color:#9db8d9;font-size:13.5px" data-i18n="settings.wjump">Độ Nhảy Cửa Sổ</span>
      <button class="btn-ghost" data-wjump="calm" data-i18n="settings.wjump_calm">Êm</button>
      <button class="btn-ghost" data-wjump="normal" data-i18n="settings.wjump_normal">Vừa</button>
      <button class="btn-ghost" data-wjump="wild" data-i18n="settings.wjump_wild">Điên</button>
    </div>
    <!-- feat/mobile-quality: đổi nấc chất lượng giữa run -->
    <div class="menu-btns" style="margin-top:12px;align-items:center">
      <span style="color:#9db8d9;font-size:13.5px" data-i18n="settings.quality">Chất lượng</span>
      <button class="btn-ghost" data-quality="auto" data-i18n="settings.quality_auto">Tự động</button>
      <button class="btn-ghost" data-quality="high" data-i18n="settings.quality_high">Cao</button>
      <button class="btn-ghost" data-quality="balanced" data-i18n="settings.quality_balanced">Cân bằng</button>
      <button class="btn-ghost" data-quality="lite" data-i18n="settings.quality_lite">Nhẹ</button>
    </div>
    <div class="stat-line" data-i18n="pause.hint">P / Esc: tiếp tục · M: bật/tắt nhạc</div>
  </div>

  <div class="overlay" id="ov-over">
    <div class="ov-brand"><img src="assets/brand/dever-logo.png" alt="FU-DEVER" data-hide-onerror> FU-DEVER</div>
    <h2><svg class="ic" aria-hidden="true"><use href="#i-window-crack"/></svg> <span id="over-title">GAME OVER</span></h2>
    <div class="score-big" id="over-score"></div>
    <div class="stat-line" id="over-stats"></div>
    <div id="over-record" style="color:#fde68a;font-weight:700;font-size:18px"></div>
    <div class="menu-btns">
      <button class="btn-big" id="btn-again" style="font-size:16px;padding:12px 28px"><svg class="ic" aria-hidden="true"><use href="#i-restart"/></svg> <span data-i18n="gameover.retry">Chơi lại (R)</span></button>
      <button class="btn-ghost" id="btn-quit2"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg> <span data-i18n="gameover.menu">Về menu</span></button>
    </div>
    <!-- CTA web→desktop (Sprint R2 item 5): chỉ hiện khi wave≥5; ẩn mặc định,
         game.js bật theo điều kiện (không portal, không Electron). -->
    <div id="over-desktop-cta" class="desktop-cta-line" hidden>
      <svg class="ic" aria-hidden="true"><use href="#i-window"/></svg>
      <span data-i18n="cta.gameover_text">Cửa sổ này chỉ là mô phỏng. Trải nghiệm cửa sổ THẬT trên bản Desktop →</span>
      <a href="https://quangnhat1504.itch.io/windowkill?utm_source=game&utm_medium=cta&utm_campaign=desktop"
         target="_blank" rel="noopener" class="btn-ghost" data-cta-id="gameover_banner"><span data-i18n="cta.gameover_btn">Tải Desktop</span></a>
    </div>
  </div>

  <!-- banner xin phép mở popup vệ tinh (non-blocking, MULTIWINDOW-SPEC §3.1) -->
  <div id="satperm" style="display:none;position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;
       align-items:center;gap:10px;background:#0d1626ee;border:1px solid #2e6db488;border-radius:12px;
       padding:10px 14px;font-size:13.5px;color:#dbeafe;box-shadow:0 8px 28px #000a">
    <span data-i18n="satperm.text">Màn này có cửa sổ vệ tinh — cho mở nhé?</span>
    <button class="btn-ghost" id="btn-sat-allow" style="padding:10px 18px;min-height:44px" data-i18n="satperm.allow">Cho phép</button>
    <button class="btn-ghost" id="btn-sat-single" style="padding:10px 18px;min-height:44px" data-i18n="satperm.single">Chơi 1 cửa sổ</button>
  </div>
</div>
