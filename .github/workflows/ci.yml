# WINDOWKILL Web Edition — CI tối giản
# Studio rule: green CI before merge (branch → PR → test/review → merge, không direct-main)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check (node --check)
        run: |
          set -e
          for f in js/*.js js/game/*.js server/src/*.js scripts/*.js tests/*.test.js; do
            echo "check $f"
            node --check "$f"
          done

      - name: game.js build freshness check (js/game/* → js/game.js)
        # js/game.js là GENERATED từ js/game/*.js (scripts/build-game.js).
        # Step này bắt trường hợp sửa source mà quên rebuild.
        run: node scripts/build-game.js --check

      - name: SW cache version check (auto-stamp)
        # sw.js VERSION do máy stamp (scripts/bump-sw.js, via pre-commit hook).
        # Step này bắt trường hợp bypass hook / quên stamp: PR đổi site assets
        # mà sw.js không restamp → FAIL. Cần deepen history vì checkout mặc định
        # shallow (fetch-depth 1) không đủ để diff với base branch.
        run: |
          git fetch --deepen=50 origin "${{ github.base_ref || 'main' }}" || true
          node scripts/bump-sw.js --check

      - name: Run test suite
        run: node --test tests/*.test.js

      - name: Verify required assets
        run: |
          set -e
          for a in assets/favicon.png assets/hero.jpg assets/logo-lockup.webp assets/og-banner.jpg; do
            test -f "$a" || { echo "missing $a"; exit 1; }
            echo "ok $a"
          done

      - name: Security audit (npm audit)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "no package.json at root — skip npm audit"
          fi

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite cần Node >= 22.5 — giữ đồng nhất với job client
          node-version: 24

      - name: Run server test suite
        run: cd server && npm test
