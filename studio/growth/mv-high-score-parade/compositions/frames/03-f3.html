<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8" /><title>03-f3 · feature tour + logo + shard clear</title></head>
<body>
<template>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  #root {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: #0A0A0F; color: #FFFDF5;
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  }
  #g1, #g2, #g3, #g4, #g5 { position: absolute; inset: 0; }

  /* ---------- g1: card flyby ---------- */
  .cf_stage { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 55%; }
  .cf_scene { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-12deg); }
  .cf_card { position: absolute; left: 260px; top: 145px; width: 1400px; height: 790px;
    background: #FFFFFF; border: 4px solid #000000; box-shadow: 8px 8px 0 #000000;
    display: flex; align-items: center; justify-content: center; padding: 90px 104px;
    will-change: transform, opacity; }
  .cf_title { font-size: 120px; font-weight: 900; letter-spacing: -0.03em; line-height: 0.95;
    color: #0A0A0F; text-align: center; max-width: 100%; overflow-wrap: break-word; text-transform: uppercase; }
  .cf_tag { position: absolute; left: 48px; top: 40px; font-size: 24px; font-weight: 700;
    letter-spacing: 0.2em; color: #0A0A0F; text-transform: uppercase; }
  .cf_dot { position: absolute; right: 48px; top: 40px; width: 44px; height: 44px;
    border-radius: 50%; border: 4px solid #000; }
  .cf_play { position: absolute; right: 68px; bottom: 70px; width: 80px; height: 80px;
    border-radius: 50%; background: #F7CB46; display: flex; align-items: center; justify-content: center;
    border: 4px solid #000; }
  .cf_play::after { content: ""; width: 0; height: 0; border-left: 22px solid #000;
    border-top: 14px solid transparent; border-bottom: 14px solid transparent; margin-left: 5px; }

  /* ---------- g2: split-anchor word-slot ---------- */
  .sa_frame { position: absolute; left: 50%; top: 43%; transform: translate(-50%, -50%); }
  .sa_lockup { display: flex; align-items: center; }
  .sa_anchors { display: flex; flex-direction: column; align-items: flex-start; }
  .sa_anchor { font-weight: 900; line-height: 0.96; letter-spacing: -0.04em;
    text-transform: lowercase; white-space: nowrap; color: #0A0A0F; }
  .sa_slotbox { position: relative; margin-left: 48px; min-height: 380px; }
  .sa_gline { background: #0A0A0F; padding: 0.12em 0.3em; margin-bottom: 14px;
    transform-origin: 0% 50%; }
  .sa_gline span { color: #FFFDF5; }

  /* ---------- g3: mosaic free-price ---------- */
  .fp_tile { position: absolute; display: flex; align-items: center; justify-content: center;
    border: 4px solid #000; overflow: hidden; }
  .fp_tile span { font-weight: 800; letter-spacing: -0.01em; text-transform: uppercase; }

  /* ---------- g4: logo lockup pulse ---------- */
  .lg_center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .lg_row { display: flex; align-items: center; gap: 44px; }
  .lg_mark { font-size: 150px; font-weight: 900; color: #FE90E8; line-height: 1;
    will-change: transform, opacity; }
  .lg_word { font-size: 210px; font-weight: 900; letter-spacing: -0.03em; line-height: 0.9;
    text-transform: uppercase; color: #FFFDF5; will-change: transform, opacity; }
  .lg_word.accent { color: #F7CB46; }

  /* ---------- g5: shard cascade + hold line ---------- */
  .sh_grid { position: absolute; inset: 0; display: flex; flex-wrap: wrap; }
  .sh_card { width: 316px; height: 186px; margin: 14px; background: #FFFFFF;
    border: 4px solid #000; box-shadow: 8px 8px 0 #FE90E8; transform: rotate(-1.5deg); }
  .sh_card:nth-child(3n) { box-shadow: 8px 8px 0 #99E885; transform: rotate(2deg); }
  .sh_card:nth-child(3n+1) { box-shadow: 8px 8px 0 #C0F7FE; }
  #sh_hold { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; }
  #sh_hold .line { font-size: 150px; font-weight: 900; letter-spacing: -0.03em;
    text-transform: uppercase; color: #FFFDF5; text-align: center; line-height: 0.95; }
  #sh_hold .line em { font-style: normal; color: #F7CB46; }
</style>

<div id="root" data-composition-id="03-f3" data-width="1920" data-height="1080" data-duration="39" data-root="true">
  <div id="g1"><div class="cf_stage"><div class="cf_scene" id="cf_scene"></div></div></div>
  <div id="g2" style="background:#0A0A0F"><div class="sa_frame"><div class="sa_lockup" id="sa_lockup">
    <div class="sa_anchors" id="sa_anchors"></div>
    <div class="sa_slotbox" id="sa_slotbox"></div>
  </div></div></div>
  <div id="g3"></div>
  <div id="g4"><div class="lg_center"><div class="lg_row" id="lg_row">
    <span class="lg_mark" id="lg_ml">▲</span>
    <span class="lg_word" id="lg_w1">HIGH</span>
    <span class="lg_word accent" id="lg_w2">SCORE</span>
    <span class="lg_word" id="lg_w3">PARADE</span>
    <span class="lg_mark" id="lg_mr">■</span>
  </div></div></div>
  <div id="g5"><div class="sh_grid" id="sh_grid"></div>
    <div id="sh_hold"><div class="line">SỐNG ĐƯỢC<br>LÀ <em>THẮNG</em></div></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var T0 = 38.0, SPAN = 39.0;
  var tx = function (t) { return Math.round((t - T0) * 1000) / 1000; };
  var tl = gsap.timeline({ paused: true });
  var PASTEL = ["#FE90E8", "#C0F7FE", "#99E885", "#F7CB46", "#FFDC8B"];

  /* ============ g1: card flyby (38–46 = local 0–8) ============ */
  var CARDS = [
    { tag: "FEATURE 01", title: "BOSS MỖI 5 WAVE", color: "#FE90E8" },
    { tag: "FEATURE 02", title: "LÊN CẤP · DRAFT 3/12", color: "#C0F7FE" },
    { tag: "FEATURE 03", title: "CHỌN 1 TRONG 3 ĐỘ KHÓ", color: "#99E885" },
    { tag: "FEATURE 04", title: "CHƠI ĐƯỢC TRÊN ĐIỆN THOẠI", color: "#F7CB46" },
    { tag: "FEATURE 05", title: "KỶ LỤC LƯU TRÊN MÁY", color: "#FFDC8B" },
  ];
  var LANDED = [1.0, 2.5, 4.4, 5.9, 6.9]; // local 0-based (= track 39/40.5/42.4/43.9/44.9)
  var scene = document.getElementById("cf_scene");
  var cardEls = [], dots = [];
  CARDS.forEach(function (c, i) {
    var d = document.createElement("div");
    d.className = "cf_card";
    d.style.zIndex = String(10 + i);
    var tag = document.createElement("span"); tag.className = "cf_tag"; tag.textContent = c.tag;
    var dot = document.createElement("span"); dot.className = "cf_dot"; dot.style.background = c.color;
    var t = document.createElement("div"); t.className = "cf_title"; t.textContent = c.title;
    var play = document.createElement("span"); play.className = "cf_play";
    d.appendChild(tag); d.appendChild(dot); d.appendChild(t); d.appendChild(play);
    scene.appendChild(d);
    cardEls.push(d); dots.push(dot);
  });
  gsap.set(cardEls, { opacity: 0, y: 900, scale: 0.7, rotation: 3 });
  gsap.set(dots, { scale: 0 });
  cardEls.forEach(function (el, i) {
    var t = Math.max(0, LANDED[i] - 0.0);
    tl.fromTo(el, { opacity: 0, y: 900, scale: 0.7, rotation: 3 },
      { opacity: 1, y: 0, scale: 1, rotation: (i % 2 ? 1 : -1) * 1.2, duration: 0.4, ease: "power3.out", immediateRender: false },
      tx(38.0 + t));
    tl.fromTo(dots[i], { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(2.4)", immediateRender: false },
      tx(38.0 + t + 0.3));
    if (i > 0) { // previous card exits down-left like a dealer
      tl.to(cardEls[i - 1], { opacity: 0, y: 500, x: -280, scale: 0.85, duration: 0.35, ease: "power2.in", overwrite: "auto" },
        tx(38.0 + t));
    }
  });
  // last card swipes out at 46
  tl.to(cardEls[CARDS.length - 1], { opacity: 0, x: 900, rotation: 6, duration: 0.35, ease: "power2.in", overwrite: "auto" }, tx(45.6));
  tl.set("#g1", { autoAlpha: 0 }, tx(46.0));
  tl.set("#g1", { autoAlpha: 1 }, 0);

  /* ============ g2: anchor / slot (46–57 = local 8–19) ============ */
  var g2 = document.getElementById("g2");
  g2.style.background = "#FFFDF5"; // paper plate
  var anchorsBox = document.getElementById("sa_anchors");
  var slotbox = document.getElementById("sa_slotbox");
  var ANCHORS = ["CỬA SỔ", "THANH MÁU", "ĐIỂM SỐ"];
  var ROWS = [
    { words: ["QUÁI GẶM", "VIỀN"], in: 49.0, out: 51.0, color: "#FE90E8" },
    { words: ["ĐẠN ĐÁ", "BAY"], in: 51.0, out: 53.0, color: "#C0F7FE" },
    { words: ["GEM", "RƠI"], in: 53.0, out: 55.0, color: "#99E885" },
    { words: ["BẠN", "SỐNG SÓT"], in: 54.8, out: 56.5, color: "#F7CB46" },
  ];
  var anchorEls = ANCHORS.map(function (w) {
    var el = document.createElement("div");
    el.className = "sa_anchor";
    el.style.fontSize = "140px";
    el.textContent = w;
    anchorsBox.appendChild(el);
    return el;
  });
  var rowGroups = ROWS.map(function (r) {
    var g = document.createElement("div");
    g.style.cssText = "position:absolute;left:0;top:0;display:flex;flex-direction:column";
    r._els = r.words.map(function (w, li) {
      var line = document.createElement("div");
      line.className = "sa_gline";
      line.style.fontSize = "120px";
      line.style.marginLeft = (li * 40) + "px";
      line.innerHTML = "<span>" + w + "</span>";
      line.firstChild.style.color = r.color;
      g.appendChild(line);
      return line;
    });
    slotbox.appendChild(g);
    return g;
  });
  gsap.set(anchorEls, { autoAlpha: 0, x: -90, scaleX: 0.6 });
  gsap.set(slotbox, { autoAlpha: 0 });
  rowGroups.forEach(function (g) { gsap.set(g, { autoAlpha: 0 }); });
  // shake shells
  var g2lockup = document.getElementById("sa_lockup");
  gsap.set(g2lockup, { rotation: -2.5 });

  anchorEls.forEach(function (el, i) {
    tl.fromTo(el, { autoAlpha: 0, x: -90, scaleX: 0.6 },
      { autoAlpha: 1, x: 0, scaleX: 1, duration: 0.3, ease: "expo.out", immediateRender: false },
      tx(46.2 + i * 0.55));
  });
  ROWS.forEach(function (r, ri) {
    var g = rowGroups[ri];
    r._els.forEach(function (el, li) {
      tl.fromTo(el, { autoAlpha: 0, x: 260, scaleX: 1.5 },
        { autoAlpha: 1, x: 0, scaleX: 1.05, duration: 0.28, ease: "expo.out", overwrite: "auto", immediateRender: false },
        tx(r.in + li * 0.16));
    });
    r._els.forEach(function (el, li) {
      tl.to(el, { autoAlpha: 0, x: -150, y: 60, scaleX: 0.9, duration: 0.2, ease: "power3.in", overwrite: "auto" },
        tx(r.out + li * 0.06));
    });
    // group-level visibility pop (guarantee)
    tl.set(g, { autoAlpha: 1 }, tx(r.in - 0.02));
    tl.set(g, { autoAlpha: 0 }, tx(r.out + 0.7));
  });
  // shake jolt per beat bar (52 / 54 / 55.5)
  [52.0, 54.0, 55.5].forEach(function (t, k) {
    var jx = (((k * 37) % 11) - 5) * 8, jy = (((k * 53) % 9) - 4) * 6, jr = (((k * 29) % 7) - 3) * 1.4;
    tl.fromTo(g2lockup, { x: jx, y: jy, rotation: -2.5 + jr },
      { x: 0, y: 0, rotation: -2.5, duration: 0.3, ease: "back.out(3)", immediateRender: false }, tx(t));
  });
  tl.set(g2, { autoAlpha: 0 }, tx(57.0));
  tl.set(g2, { autoAlpha: 0 }, 0);
  tl.set(g2, { autoAlpha: 1 }, tx(46.0));

  /* ============ g3: mosaic CHƠI MIỄN PHÍ (57–64) ============ */
  var g3 = document.getElementById("g3");
  var FPW = 6, FPH = 3; // 6×3 = 18 tiles filling the frame (mosaic grid)
  var fpTiles = [];
  var colLabels = [
    "CHƠI", "MIỄN", "PHÍ", "CHƠI", "MIỄN", "PHÍ",
    "CHƠI", "MIỄN", "PHÍ", "CHƠI", "MIỄN", "PHÍ",
    "CHƠI", "MIỄN", "PHÍ", "CHƠI", "MIỄN", "PHÍ",
  ];
  for (var cy = 0; cy < FPH; cy++) {
    for (var cx = 0; cx < FPW; cx++) {
      var ft = document.createElement("div");
      ft.className = "fp_tile";
      var tw = 1920 / FPW, thh = 1080 / FPH;
      ft.style.left = (cx * tw) + "px"; ft.style.top = (cy * thh) + "px";
      ft.style.width = (tw - 8) + "px"; ft.style.height = (thh - 8) + "px";
      var p = PASTEL[(cy * FPW + cx) % PASTEL.length];
      ft.style.background = p;
      var span = document.createElement("span");
      span.textContent = colLabels[cy * FPW + cx] || "";
      span.style.color = parseInt(p.substr(1, 2), 16) > 128 ? "#0A0A0F" : "#FFFDF5";
      span.style.fontSize = thh * 0.32 + "px";
      ft.appendChild(span);
      g3.appendChild(ft);
      fpTiles.push(ft);
    }
  }
  gsap.set(fpTiles, { autoAlpha: 0, scale: 0.85 });
  var FILL = [57.0, 57.6, 58.2, 59.0, 59.8, 60.4, 61.0, 62.0, 62.7, 63.0, 63.4, 63.8, 64.0];
  FILL.forEach(function (t, i) {
    tl.fromTo(fpTiles[i], { autoAlpha: 0, scale: 0.85 },
      { autoAlpha: 1, scale: 1, duration: 0.12, ease: "back.out(1.6)", immediateRender: false }, tx(t));
  });
  tl.set("#g3", { autoAlpha: 0 }, tx(64.0));
  tl.set("#g3", { autoAlpha: 0 }, 0);
  tl.set("#g3", { autoAlpha: 1 }, tx(57.0));

  /* ============ g4: logo split/lockup/pulse (64–70) ============ */
  var g4 = document.getElementById("g4");
  var marks = [document.getElementById("lg_ml"), document.getElementById("lg_mr")];
  var lwords = ["lg_w1", "lg_w2", "lg_w3"].map(function (id) { return document.getElementById(id); });
  var SPLIT_GAP = 760; // gap width in px each side (fit 1920px canvas)
  gsap.set(marks[0], { autoAlpha: 0, x: 30 });
  gsap.set(marks[1], { autoAlpha: 0, x: -30 });
  gsap.set(lwords, { autoAlpha: 0, scaleX: 0.58, scaleY: 1.09 });
  gsap.set("#g4", { autoAlpha: 0 });
  tl.set("#g4", { autoAlpha: 0 }, 0);

  tl.to(marks, { autoAlpha: 1, duration: 0.16, ease: "power2.out", immediateRender: false }, tx(64.1));
  tl.to(marks[0], { x: -SPLIT_GAP, duration: 0.3, ease: "expo.out", immediateRender: false }, tx(64.3));
  tl.to(marks[1], { x: SPLIT_GAP, duration: 0.3, ease: "expo.out", immediateRender: false }, tx(64.3));
  var lt = [65.1, 66.0, 67.0];
  lwords.forEach(function (el, i) {
    tl.fromTo(el, { autoAlpha: 0, scaleX: 0.58, scaleY: 1.09 },
      { autoAlpha: 1, scaleX: 1, scaleY: 1, duration: 0.26, ease: "power3.out", immediateRender: false }, tx(lt[i]));
  });
  // snap close 68
  tl.set(lwords, { autoAlpha: 0 }, tx(68.0));
  tl.set(marks[0], { x: 30 }, tx(68.0));
  tl.set(marks[1], { x: -30 }, tx(68.0));
  tl.fromTo("#lg_row", { scale: 0.9 }, { scale: 1, duration: 0.24, ease: "power2.out", immediateRender: false }, tx(68.0));
  // pulse on the hihat slabs 68.5/69/69.5
  var PULSES = [68.5, 69.0, 69.5];
  PULSES.forEach(function (t, k) {
    var dir = k % 2 ? 1 : -1;
    tl.to("#lg_row", { y: 26 * dir, rotation: 2.2 * dir, duration: 0.16, ease: "power2.out", overwrite: "auto" }, tx(t));
    tl.to("#lg_row", { y: -10 * dir, rotation: -0.8 * dir, duration: 0.2, ease: "power2.inOut", overwrite: "auto" }, tx(t + 0.16));
  });
  // hold pulse through 70 for handoff
  tl.to("#lg_row", { opacity: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" }, tx(69.8));
  tl.set(g4, { autoAlpha: 0 }, tx(70.0));
  tl.set(g4, { autoAlpha: 0 }, 0);
  tl.set(g4, { autoAlpha: 1 }, tx(64.0));

  /* ============ g5: shard cascade + hold line (70–77) ============ */
  var grid = document.getElementById("sh_grid");
  for (var sc = 0; sc < 15; sc++) {
    var cdiv = document.createElement("div");
    cdiv.className = "sh_card";
    cdiv.style.opacity = "0";
    grid.appendChild(cdiv);
    tl.fromTo(cdiv, { opacity: 0, y: 200, scale: 0.85 },
      { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "back.out(1.8)", immediateRender: false },
      tx(70.0 + sc * 0.22));
  }
  // hold line visible 73.2 → 77
  tl.to("#sh_hold", { opacity: 1, duration: 0.01, immediateRender: false }, tx(73.2));
  tl.fromTo("#sh_hold .line", { scale: 1.15, filter: "blur(14px)" },
    { scale: 1, filter: "blur(0px)", duration: 0.7, ease: "power2.out", immediateRender: false }, tx(73.3));
  // tiles pop out at 70 + shake on the 73 DROP
  tl.to(grid, { opacity: 0, duration: 0.3, ease: "power2.in", overwrite: "auto" }, tx(72.6));
  tl.set("#g5", { autoAlpha: 0 }, 0);
  tl.set("#g5", { autoAlpha: 1 }, tx(70.0));

  tl.to({}, { duration: 0.001 }, SPAN - 0.001);
  tl.seek(0);
  window.__timelines["03-f3"] = tl;
})();
</script>
</template>
