# WINDOWKILL Web Edition — CI tối giản
# Studio rule: green CI before merge (branch → PR → test/review → merge, không direct-main)
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check (node --check)
        run: |
          set -e
          for f in js/*.js server/src/*.js tests/*.test.js; do
            echo "check $f"
            node --check "$f"
          done

      - name: Run test suite
        run: node --test tests/*.test.js

      - name: Verify required assets
        run: |
          set -e
          for a in assets/favicon.png assets/hero.jpg assets/logo-lockup.webp assets/og-banner.jpg; do
            test -f "$a" || { echo "missing $a"; exit 1; }
            echo "ok $a"
          done

      - name: Security audit (npm audit)
        run: |
          if [ -f package.json ]; then
            npm audit --audit-level=high
          else
            echo "no package.json at root — skip npm audit"
          fi
